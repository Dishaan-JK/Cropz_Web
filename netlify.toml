[build]
  command = "./scripts/netlify_build.sh"
  publish = "frontend/build/web"
  functions = "netlify/functions"

[build.environment]
  FLUTTER_VERSION = "3.41.9"
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/api/cards/*"
  to = "/.netlify/functions/cards/:splat"
  status = 200

[[redirects]]
  from = "/api/error-requests"
  to = "/.netlify/functions/error_requests"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
